<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Studio Playlist</title>

<style>
body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

.card {
  margin: 24px;
  padding: 24px 26px;
  border-radius: 16px;
  background: #ffffff;
  box-shadow: 0 14px 36px rgba(0,0,0,0.07);
}

.header {
  margin-bottom: 18px;
}

.title {
  font-size: 20px;
  font-weight: 600;
}

.subtitle {
  font-size: 14px;
  color: #666;
}

.track {
  margin-bottom: 18px;
}

.track-title {
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 6px;
}

audio {
  width: 100%;
}

.magic {
  margin-top: 16px;
  font-size: 13px;
  color: #999;
  text-align: right;
  opacity: 0.3;
  transition: opacity 0.4s ease;
}

.magic.playing {
  opacity: 1;
}
</style>
</head>

<body>

<div class="card">
  <div class="header">
    <div class="title">Studio Playlist</div>
    <div class="subtitle">Selected mixes & productions</div>
  </div>

  <div class="track">
    <div class="track-title">Can’t Find My Way Home</div>
    <audio controls preload="none">
      <source src="https://github.com/rjgrant/G-M-Music/blob/18423b247d5d51f48396f7909134f916c4645e29/CantFindMyWayHome1.0.3.2.m4a?raw=1" type="audio/mp4">
    </audio>
  </div>

  <!-- ADD MORE TRACKS BY COPYING THIS BLOCK
  <div class="track">
    <div class="track-title">Track Name</div>
    <audio controls preload="none">
      <source src="DROPBOX_LINK?raw=1" type="audio/mpeg">
    </audio>
  </div>
  -->

  <div id="magic" class="magic">✨ magic word: clarity</div>
</div>

<script>
const players = document.querySelectorAll("audio");
const magic = document.getElementById("magic");

players.forEach(player => {
  player.addEventListener("play", () => {
    players.forEach(p => { if (p !== player) p.pause(); });
    magic.classList.add("playing");
  });
});
</script>

</body>
</html>
